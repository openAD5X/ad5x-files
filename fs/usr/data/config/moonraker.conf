# Moonraker settings for OpenAD5X

[server]
host: 0.0.0.0
port: 7125
# Klippy's API socket (10-klipper.sh starts Klippy with -a /tmp/uds)
klippy_uds_address: /tmp/uds

[machine]
provider: none
validate_service: false
validate_config: false

[file_manager]
enable_object_processing: True

[authorization]
enable_api_key: false
trusted_clients:
  0.0.0.0/0
cors_domains:
  *://*.local
  *://*.lan
  *://localhost
  *://localhost:*

[update_manager]
refresh_interval: 168
enable_auto_refresh: True
# no package manager to update the system with
enable_system_updates: False

# Kalico here is kalico-ad5x, so differences from upstream Klipper are expected
[update_manager klipper]
report_anomalies: False

[update_manager mainsail]
type: web
channel: stable
repo: mainsail-crew/mainsail
path: /usr/data/mainsail

[update_manager fluidd]
type: web
channel: stable
repo: fluidd-core/fluidd
path: /usr/data/fluidd

# printer camera, served by mjpg_streamer
[webcam printer]
service: mjpegstreamer
stream_url: /webcam/?action=stream
snapshot_url: /webcam/?action=snapshot

# Spoolman: remove the # in front of these lines and put in your Spoolman
# server's address. Pick the active spool in Fluidd or Mainsail.
#[spoolman]
#server: http://192.168.1.100:7912
#sync_rate: 5
