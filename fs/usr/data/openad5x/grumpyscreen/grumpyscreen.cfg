#
# GrumpyScreen settings shipped with OpenAD5X. Put your own changes in
# config/grumpyscreen.ini; they are applied on top of this file.

[default_macros]
cooldown: TURN_OFF_HEATERS
extrude: _GUPPYSCREEN_EXTRUDE EXTRUDER_TEMP={} EXTRUDE_LEN={} SPEED={}
retract: _GUPPYSCREEN_RETRACT EXTRUDER_TEMP={} EXTRUDE_LEN={} SPEED={}
load_filament: LOAD_FILAMENT EXTRUDER_TEMP={}
unload_filament: UNLOAD_FILAMENT EXTRUDER_TEMP={}

[ui]
invert_z_icon: false
prompt_emergency_stop: true
show_screws_tilt: false
# seconds before the display sleeps, -1 = never
display_sleep_sec: 600
# true: sleeping switches the backlight off rather than showing a black screen
display_sleep_backlight: true
# info, debug or trace
log_level: info
display_rotate: 0
# extruder panel choices, separated by commas
extruder_temp_presets: 200, 220, 240, 260, 280
extruder_temp_default: 220
extruder_length_presets: 5, 10, 20, 50, 100
extruder_length_default: 10
extruder_speed_presets: 1, 2, 5, 10, 25
extruder_speed_default: 5

# Colours. Other primary/secondary pairs:
#   blue    0x2196F3 / 0xF44336
#   green   0x4CAF50 / 0xF44336
#   pink    0xFEC5E5 / 0xE91E63
#   purple  0x9C27B0 / 0xF44336
#   red     0xF44336 / 0xF44336
#   yellow  0xFFEB3B / 0xF44336
# Keep every key below; any that is left out shows up magenta.
[theme]
primary_colour: 0x2196F3
secondary_colour: 0xF44336
# background, and panels placed on it
bg_colour: 0x282B30
surface_colour: 0x282B30
# buttons and other raised items
raised_colour: 0x2F3237
# behind the active navigation tab
selected_colour: 0x9E9E9E
border_colour: 0x2F3237
border_dim_colour: 0x616161
text_colour: 0xFAFAFA
text_dim_colour: 0x9E9E9E
# tile icons (stop, shutdown and similar use danger_colour)
icon_colour: 0xFFFFFF
disabled_colour: 0x757575
# text and icons on top of primary_colour
on_primary_colour: 0xFFFFFF
danger_colour: 0xD32F2F
warning_colour: 0xFFA000
success_colour: 0x388E3C
info_colour: 0x1976D2

[mmu]
# afc: ArmoredTurtle AFC (BoxTurtle, Canvas and others)
# hh: Happy Hare
# none: hide the MMU panel
backend: afc
# lane edit screen materials, comma separated; the first ones are shown
# directly, the others under "more materials"
materials: PLA, PETG, ABS, TPU, PLA+, PLA-CF, PETG-CF, ABS-CF, ASA, PC, PA, PA-CF, PVA, HIPS

[moonraker]
host: 127.0.0.1
port: 7125
# needed for thumbnails, or when host is another machine
thumbnail_path:

# programs run by the screen's buttons (scripts in startup/commands)
[commands]
factory_reset_cmd:
gui_restart_cmd: /bin/sh /usr/data/openad5x/startup/commands/restart-gui.sh
switch_to_stock_cmd:
support_zip_cmd: /bin/sh /usr/data/openad5x/startup/commands/support-zip.sh
restart_klipper_cmd: /bin/sh /usr/data/openad5x/startup/commands/restart-klipper.sh
shutdown_host_cmd: /sbin/halt
restart_wifi_cmd: /bin/sh /usr/data/openad5x/startup/commands/restart-wifi.sh

# AD5X fans, lights and heaters
[fan "fan_generic fanM106"]
display_name: Part Cooling

[fan "heater_fan heat_fan"]
display_name: Heatbreak

[fan "controller_fan pcb_fan"]
display_name: Mainboard Fan

[monitored_sensor "extruder"]
display_name: Extruder
color: red
controllable: true

[monitored_sensor "heater_bed"]
display_name: Bed
color: purple
controllable: true

[led "led chamber_led"]
display_name: Chamber Light
pwm: false

# Names used by common Klipper configs. Entries for objects your printer
# doesn't have are not shown.
[fan "fan_generic part"]
display_name: Toolhead

[fan "output_pin fan0"]
display_name: Toolhead

[fan "fan"]
display_name: Toolhead

[fan "fan_generic chamber"]
display_name: Chamber

[fan "output_pin fan1"]
display_name: Chamber

[fan "fan_generic auxiliary"]
display_name: Auxiliary

[fan "output_pin fan2"]
display_name: Auxiliary

[led "output_pin LED"]
display_name: LED
pwm: false

[led "output_pin red_pin"]
display_name: Red
pwm: false

[led "output_pin green_pin"]
display_name: Green
pwm: false

[led "output_pin yellow_pin"]
display_name: Yellow
pwm: false

[led "output_pin light_pin"]
display_name: Light
pwm: false

[monitored_sensor "temperature_fan chamber_fan"]
display_name: Chamber
color: blue
controllable: true
